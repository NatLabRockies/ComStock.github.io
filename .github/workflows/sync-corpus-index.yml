# Keeps _data/corpus_index.json in step with the newest BuildStock corpus release.
#
# The site uses that file to put a "read this page as Markdown" link on every page
# that has a copy in the corpus, and to describe the corpus as a schema.org Dataset.
# Nothing publishes on its own: when the file changes, this job opens a pull request
# for a person to review and merge.
#
# Runs every Monday at 12:00 UTC, or on demand from the Actions tab.

name: Sync corpus index

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch index.json from the newest corpus release tag
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Tags are named <release id>-v<N>; the release folder is processed/<product>/<release id>/,
          # and the product is the first underscore-separated part of the release id.
          tag=$(gh api repos/NatLabRockies/buildstock-corpus/releases/latest --jq .tag_name)
          release=${tag%-v*}
          product=${release%%_*}
          echo "newest corpus release: $tag ($product / $release)"
          mkdir -p _data
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/NatLabRockies/buildstock-corpus/contents/processed/$product/$release/index.json?ref=$tag" \
            > _data/corpus_index.json
          # The file must be valid JSON and must name the tag it was fetched from.
          got=$(jq -r .corpus_version _data/corpus_index.json)
          if [ "$got" != "$tag" ]; then
            echo "corpus_version in index.json is '$got', expected '$tag'" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Open a pull request if the index changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync-corpus-index
          delete-branch: true
          commit-message: "Update corpus index to ${{ steps.fetch.outputs.tag }}"
          title: "Update corpus index to ${{ steps.fetch.outputs.tag }}"
          body: |
            Automated: `_data/corpus_index.json` refreshed from the newest BuildStock corpus
            release, `${{ steps.fetch.outputs.tag }}`.

            This file drives the per-page "read this page as Markdown" links and the
            Dataset structured data on For Developers. Review the diff, then merge.
          labels: automated
